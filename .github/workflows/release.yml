name: 每周构建 BusyBox NDK

on:
  schedule:
    # 每周一 UTC 3:00 执行 (北京时间周一 11:00)
    - cron: '0 3 * * 1'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write   # 创建 Release 必需,不加会 403

jobs:
  # Job 1: 检查最新版本
  check-version:
    name: 检查最新版本
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      latest-version: ${{ steps.check.outputs.latest-version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查是否已构建
        id: check
        run: |
          # 优先从 GitHub 镜像抓 tag (git.busybox.net 经常 404/超时,不再优先用它)
          LATEST_VERSION=$(git ls-remote --tags https://github.com/vda-linux/busybox_mirror 2>/dev/null | \
            grep -o 'refs/tags/[0-9]*_[0-9]*_[0-9]*$' | \
            sort -V | tail -1 | sed 's|refs/tags/||')

          # 兜底:从下载页抓 tarball 名
          if [ -z "$LATEST_VERSION" ]; then
            echo "Git 源不可用,从下载页解析最新版本..."
            LATEST_VERSION=$(curl -fsSL https://busybox.net/downloads/ 2>/dev/null | \
              grep -oE 'busybox-[0-9]+\.[0-9]+\.[0-9]+\.tar\.bz2' | \
              sort -V | tail -1 | sed -E 's/busybox-|\.tar\.bz2//g' | tr '.' '_')
          fi

          # 最后兜底:硬编码一个近期稳定版,避免完全失败
          if [ -z "$LATEST_VERSION" ]; then
            echo "全部探测失败,使用硬编码版本 1_38_0"
            LATEST_VERSION="1_38_0"
          fi

          echo "最新版本: $LATEST_VERSION"
          echo "latest-version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          if git tag --list | grep -q "^busybox-${LATEST_VERSION}$"; then
            echo "版本 $LATEST_VERSION 已存在,跳过构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "版本 $LATEST_VERSION 不存在,开始构建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # Job 2: 矩阵并行构建
  build:
    name: 编译 ${{ matrix.arch }}
    needs: check-version
    if: needs.check-version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            ndk-version: r29
            clang_triple: armv7a-linux-androideabi
            make_arch: arm
          - arch: arm64
            ndk-version: r29
            clang_triple: aarch64-linux-android
            make_arch: arm64
          - arch: x86
            ndk-version: r29
            clang_triple: i686-linux-android
            make_arch: x86
          - arch: x86_64
            ndk-version: r29
            clang_triple: x86_64-linux-android
            make_arch: x86_64
        # 注意: 不再包含 MIPS/mips64。
        # NDK r18 (2018年) 起就彻底移除了 MIPS 工具链,任何现代 NDK 都无法编译 MIPS,
        # 旧配置里"用 r23c 编译 MIPS"的注释是错误的 (r23c 同样没有 mips target)。
        # 且 MIPS Android 设备早已绝迹,维持这两个矩阵项只会让定时任务周周报错。

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 设置 NDK ${{ matrix.ndk-version }}
        id: setup-ndk
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: ${{ matrix.ndk-version }}
          add-to-path: false
          local-cache: true

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 make libncurses5-dev file

      - name: 下载 BusyBox 源码
        run: |
          set -u
          VERSION="${{ needs.check-version.outputs.latest-version }}"
          VERSION_DOTTED=$(echo "$VERSION" | tr '_' '.')
          echo "下载版本: $VERSION (tarball 名: busybox-${VERSION_DOTTED})"

          rm -rf busybox busybox.tar.bz2
          SRC_OK=0

          # 1. 优先 wget tarball —— 体积小(~2.5MB)、可重试,比 git clone 稳得多
          for i in 1 2 3; do
            echo "尝试下载 tarball (第 $i 次)..."
            if wget --timeout=60 --tries=1 --retry-connrefused --waitretry=5 \
                   -qO busybox.tar.bz2 \
                   "https://www.busybox.net/downloads/busybox-${VERSION_DOTTED}.tar.bz2"; then
              if file busybox.tar.bz2 | grep -q 'bzip2'; then
                echo "tarball 下载成功"
                SRC_OK=1
                break
              else
                echo "下载到的东西不是 bzip2,删掉重试"
                file busybox.tar.bz2
                rm -f busybox.tar.bz2
              fi
            fi
            sleep 3
          done

          # 2. tarball 不行再 git clone (浅克隆,够用)
          if [ "$SRC_OK" -ne 1 ]; then
            echo "tarball 三次都失败,改用 git clone..."
            for i in 1 2 3; do
              echo "git clone 尝试 $i..."
              if git clone --depth 1 --branch "$VERSION" --quiet \
                   https://github.com/vda-linux/busybox_mirror.git busybox 2>/dev/null; then
                echo "git clone --branch 成功"
                SRC_OK=1
                break
              fi
              if git clone --depth 1 --quiet \
                   https://github.com/vda-linux/busybox_mirror.git busybox 2>/dev/null; then
                (cd busybox && \
                  git fetch --depth 1 origin tag "$VERSION" 2>/dev/null && \
                  git checkout --quiet "$VERSION" 2>/dev/null) || true
                if [ -f busybox/Makefile ]; then
                  echo "git clone + checkout 成功"
                  SRC_OK=1
                  break
                fi
              fi
              rm -rf busybox
              sleep 3
            done
          fi

          # 3. 解压 tarball (如果是走 tarball 路径)
          if [ "$SRC_OK" -eq 1 ] && [ -f busybox.tar.bz2 ]; then
            echo "解压 tarball..."
            tar -xjf busybox.tar.bz2
            if [ -d "busybox-${VERSION_DOTTED}" ]; then
              mv "busybox-${VERSION_DOTTED}" busybox
            elif [ -d busybox ]; then
              : # 某些 tarball 可能直接展开成 busybox/
            else
              echo "::error::tarball 解压后找不到 busybox 目录"
              ls -la
              exit 1
            fi
          fi

          if [ "$SRC_OK" -ne 1 ]; then
            echo "::error::源码下载完全失败 (tarball + git 都挂了)"
            exit 1
          fi

          # 验证源码目录就位
          if [ ! -f busybox/Makefile ]; then
            echo "::error::源码不完整,Makefile 缺失"
            ls -la busybox/ 2>/dev/null | head -20
            exit 1
          fi

          if [ ! -d busybox/applets ] || [ ! -d busybox/libbb ]; then
            echo "::error::源码不完整,applets/ 或 libbb/ 目录缺失(不是 busybox 源码根)"
            ls -la busybox/ 2>/dev/null | head -20
            exit 1
          fi

          echo "源码就位: Makefile + applets/ + libbb/ 都存在"
          grep -E '^VERSION' busybox/Makefile | head -3 || true

      - name: 探测并补全 NDK 工具链
        id: probe-clang
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # 1. 找到真实的 clang 二进制 (有版本号后缀的才是真二进制)
          CLANG_REAL=""
          for cand in clang-21 clang-20 clang-19 clang-18 clang-17 clang-15; do
            if [ -x "$NDK_BIN/$cand" ] && [ ! -L "$NDK_BIN/$cand" ]; then
              CLANG_REAL="$NDK_BIN/$cand"
              break
            fi
          done
          if [ -z "$CLANG_REAL" ]; then
            if [ -x "$NDK_BIN/clang" ]; then
              CLANG_REAL="$NDK_BIN/clang"
            fi
          fi
          if [ -z "$CLANG_REAL" ]; then
            echo "::error::找不到 NDK clang 真实二进制"
            ls "$NDK_BIN" 2>/dev/null | head -20
            exit 1
          fi
          echo "找到 NDK clang: $CLANG_REAL"
          "$CLANG_REAL" --version | head -1

          # 2. setup-ndk 的缓存可能把 clang 软链弄坏 (空文件或指向不存在的东西)。
          #    NDK 自带的 <triple>-clang wrapper 内部 exec 裸 clang,
          #    找不到有效 clang 就 exit 127。
          #    强制重建软链: clang -> clang-XX,让 wrapper 和裸调用都能正常工作。
          REAL_CLANG_NAME=$(basename "$CLANG_REAL")
          CLANG_BARE="$NDK_BIN/${REAL_CLANG_NAME%-[0-9]*}"

          echo "创建/重建裸 clang 软链: $CLANG_BARE -> $REAL_CLANG_NAME"
          rm -f "$CLANG_BARE"
          ln -s "$REAL_CLANG_NAME" "$CLANG_BARE"
          # 验证软链可用
          "$CLANG_BARE" --version | head -1

          # 3. 找 lld (NDK 22+ 默认 -fuse-ld=lld)
          LLD_PATH="$NDK_BIN/ld.lld"
          if [ ! -x "$LLD_PATH" ]; then
            echo "::error::找不到 ld.lld: $LLD_PATH"
            ls "$NDK_BIN" 2>/dev/null | grep -i lld
            exit 1
          fi
          echo "找到 ld.lld: $LLD_PATH"

          # 4. 找 strip/ar/ranlib
          STRIP_BIN=""
          for cand in llvm-strip strip; do
            if [ -x "$NDK_BIN/$cand" ]; then
              STRIP_BIN="$NDK_BIN/$cand"
              break
            fi
          done

          AR_BIN=""
          for cand in llvm-ar ar; do
            if [ -x "$NDK_BIN/$cand" ]; then
              AR_BIN="$NDK_BIN/$cand"
              break
            fi
          done

          RANLIB_BIN=""
          for cand in llvm-ranlib ranlib; do
            if [ -x "$NDK_BIN/$cand" ]; then
              RANLIB_BIN="$NDK_BIN/$cand"
              break
            fi
          done

          if [ -z "$STRIP_BIN" ] || [ -z "$AR_BIN" ] || [ -z "$RANLIB_BIN" ]; then
            echo "::error::NDK 工具不全:"
            echo "  STRIP=$STRIP_BIN"
            echo "  AR=$AR_BIN"
            echo "  RANLIB=$RANLIB_BIN"
            exit 1
          fi

          echo "工具链 OK:"
          echo "  CLANG = $CLANG_BARE"
          echo "  LLD   = $LLD_PATH"
          echo "  STRIP = $STRIP_BIN"
          echo "  AR    = $AR_BIN"
          echo "  RANLIB= $RANLIB_BIN"

          {
            echo "clang=$CLANG_BARE"
            echo "lld=$LLD_PATH"
            echo "strip=$STRIP_BIN"
            echo "ar=$AR_BIN"
            echo "ranlib=$RANLIB_BIN"
          } >> "$GITHUB_OUTPUT"

      - name: 配置与编译
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CLANG: ${{ steps.probe-clang.outputs.clang }}
          LLD: ${{ steps.probe-clang.outputs.lld }}
          STRIP: ${{ steps.probe-clang.outputs.strip }}
          AR: ${{ steps.probe-clang.outputs.ar }}
          RANLIB: ${{ steps.probe-clang.outputs.ranlib }}
        run: |
          cd busybox

          # 【关键1】显式 --target 和 --sysroot。
          # 旧版工作流用裸 clang 当 CC,没有 target 参数,实际是拿宿主机 glibc
          # 在编译,产物架构是错的。必须带上 Android triple 和 NDK sysroot。
          API=24
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          CC="$CLANG --target=${{ matrix.clang_triple }}${API} --sysroot=$SYSROOT -B$(dirname "$LLD")"
          echo "CC = $CC"

          # 用 BusyBox 官方的 android_502_defconfig (为 Android 调过,
          # 已关掉大量与 Bionic libc 不兼容的老 applet)。
          make ARCH=${{ matrix.make_arch }} \
               CC="$CC" \
               STRIP="$STRIP" \
               AR="$AR" \
               RANLIB="$RANLIB" \
               android_502_defconfig

          # 【关键2】NEW 符号黑名单。
          # android_502_defconfig 是老版本 busybox 时代写的,新版本 busybox
          # 新增的 kconfig 符号在 defconfig 里没有对应行,会被默认开启 (=y)。
          # 以下符号在 NDK/bionic 下编译或链接必炸,逐一显式关闭:
          sed -i 's|^CONFIG_TC=y$|# CONFIG_TC is not set|' .config
          sed -i 's|^CONFIG_USE_BB_CRYPT_YES=y$|# CONFIG_USE_BB_CRYPT_YES is not set|' .config
          sed -i 's|^CONFIG_FEATURE_SU_CHECKS_SHELLS=y$|# CONFIG_FEATURE_SU_CHECKS_SHELLS is not set|' .config
          sed -i 's|^CONFIG_ADJTIMEX=y$|# CONFIG_ADJTIMEX is not set|' .config
          sed -i 's|^CONFIG_SEEDRNG=y$|# CONFIG_SEEDRNG is not set|' .config
          sed -i 's|^CONFIG_MOUNT=y$|# CONFIG_MOUNT is not set|' .config
          sed -i 's|^CONFIG_SWAPON=y$|# CONFIG_SWAPON is not set|' .config
          sed -i 's|^CONFIG_SWAPOFF=y$|# CONFIG_SWAPOFF is not set|' .config
          # 结清依赖,让被禁 applet 的子特性自动归位
          yes '' | make ARCH=${{ matrix.make_arch }} oldconfig

          # 静态编译: NDK 的 libc.a 放在 sysroot/usr/lib/<arch>/ 无版本号目录,
          # clang 驱动能自动找到,实测 r29 + API 24 可以正常静态链接
          sed -i 's|^# CONFIG_STATIC is not set$|CONFIG_STATIC=y|' .config

          # defconfig 的 EXTRA_LDLIBS="log" 需要静态 liblog.a,NDK 不提供;
          # busybox 源码没有直接调用 __android_log,syslog 走 bionic libc,清空安全
          sed -i 's|^CONFIG_EXTRA_LDLIBS=.*$|CONFIG_EXTRA_LDLIBS=""|' .config

          # 静态链接时 busybox 的 android 兼容垫片 (getsid/adjtimex/sethostname/
          # strchrnul 等) 与 r29 libc.a 里的同名符号重复定义,
          # 允许多重定义 (busybox 自己的版本先生效,语义一致)
          sed -i 's|^CONFIG_EXTRA_LDFLAGS=.*$|CONFIG_EXTRA_LDFLAGS="-Wl,--allow-multiple-definition"|' .config

          # x86-32 专属: FAST_FUNC(regparm/stdcall) 与 bionic 头文件声明冲突
          # (如 strchrnul 在 API 23+ 已有声明),busybox 上游预留了禁用选项
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sed -i 's|^CONFIG_EXTRA_CFLAGS=.*$|CONFIG_EXTRA_CFLAGS="-DFAST_FUNC="|' .config
          fi

          # Android 上好用的特性兜底
          sed -i 's|^# CONFIG_TASKSET is not set$|CONFIG_TASKSET=y|' .config

          # 编译
          make ARCH=${{ matrix.make_arch }} \
               CC="$CC" \
               STRIP="$STRIP" \
               AR="$AR" \
               RANLIB="$RANLIB" \
               -j"$(nproc)"

          # 验证产物
          file busybox
          ls -la busybox

          # 二次 strip 瘦身
          "$STRIP" busybox
          mv busybox "busybox-${{ matrix.arch }}"
          ls -la "busybox-${{ matrix.arch }}"
          file "busybox-${{ matrix.arch }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: busybox-${{ matrix.arch }}
          path: busybox/busybox-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 9

  # Job 3: 汇总并发布 Release
  # 注意: 只要 arm/arm64 两个关键架构成功就发布 (x86 失败不阻塞),
  # 避免单一架构故障导致整个工作流永远发不出 Release
  release:
    name: 汇总并发布
    needs: [check-version, build]
    if: ${{ !cancelled() && needs.check-version.outputs.skip == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 推送 tag 需要历史

      - name: 下载所有构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 验证产物并生成 SHA256
        id: prepare
        run: |
          mkdir -p release
          cd artifacts
          ls -la

          # 硬性要求: arm + arm64 必须成功 (Android 最主流的两个架构)
          for arch in arm arm64; do
            if [ ! -f "busybox-$arch" ]; then
              echo "::error::关键产物 busybox-$arch 缺失,放弃发布"
              exit 1
            fi
            file "busybox-$arch"
          done

          # 其余架构有多少收多少
          cp busybox-* ../release/
          cd ../release
          sha256sum busybox-* > SHA256SUMS
          cat SHA256SUMS
          tar -czf "busybox-ndk-all-arch-${{ needs.check-version.outputs.latest-version }}.tar.gz" busybox-*
          ls -la

          # 生成实际包含的架构列表,写进 Release 说明
          ARCH_LIST=$(ls busybox-* | sed 's/busybox-//' | tr '\n' ',' | sed 's/,$//;s/,/, /g')
          echo "arch-list=$ARCH_LIST" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/busybox-ndk-all-arch-${{ needs.check-version.outputs.latest-version }}.tar.gz
            release/SHA256SUMS
          tag_name: busybox-${{ needs.check-version.outputs.latest-version }}
          name: "BusyBox NDK ${{ needs.check-version.outputs.latest-version }}"
          body: |
            ## BusyBox NDK 多架构静态二进制

            版本: `${{ needs.check-version.outputs.latest-version }}`

            包含架构: ${{ steps.prepare.outputs.arch-list }}

            ## 构建参数

            - NDK r29, Clang 21, API 等级 **24 (Android 7.0+)**
            - 完全静态链接,不依赖任何系统 so,任何 Android 7.0+ 设备可直接运行
            - 基于 BusyBox 官方 `android_502_defconfig` 配置

            ## 针对现代 NDK 的配置调整

            以下 applet 在 NDK/bionic 下无法编译或没有意义,已显式关闭:

            | Applet | 原因 |
            |--------|------|
            | tc | 需要内核 TCA_CBQ_* 常量,新内核 uapi 已删除,bionic 没有 |
            | mount / swapon / swapoff | bionic mntent.h 缺少 addmntent/hasmntopt |
            | adjtimex | busybox 的 __BIONIC__ 分支缺少函数声明 |
            | seedrng | getrandom 需要 API 28,且 Android 的 RNG 由系统管理 |
            | yescrypt 密码哈希 | explicit_bzero 需要 API 29 (保留 DES + SHA256/512) |

            ## 使用方法

            ```bash
            # 举例: 推到 Android 设备
            adb push busybox-arm64 /data/local/tmp/busybox
            adb shell chmod 755 /data/local/tmp/busybox
            adb shell /data/local/tmp/busybox --install -s /data/local/tmp/bb
            ```

            ## 校验

            下载 `SHA256SUMS` 并执行 `sha256sum -c SHA256SUMS` 验证完整性。

            提示: MIPS 架构自 NDK r18 (2018) 起已彻底移除支持,本仓库不再提供 MIPS 构建。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
